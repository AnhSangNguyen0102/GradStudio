<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Chụp Của Tôi – GradStudio</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="logo" aria-label="Trang chủ GradStudio">
        <span>GradStudio</span>
      </a>

      <!-- Navigation ngang trên Desktop (≥768px) -->
      <nav class="main-nav nav-desktop" aria-label="Điều hướng chính">
        <a href="index.html#dich-vu" class="nav-link">Dịch vụ</a>
        <a href="index.html#quy-trinh" class="nav-link">Quy trình</a>
        <a href="lich-chup-cua-toi.html" class="nav-link active">Lịch chụp của tôi</a>
      </nav>

      <!-- Cụm bên phải: Profile + Menu Dropdown Mobile (<768px) -->
      <div class="header-right">
        <div class="user-profile" aria-label="Tài khoản khách hàng">
          <div class="avatar-circle" aria-hidden="true">L</div>
          <span class="user-name">Linh</span>
        </div>

        <!-- Menu Dropdown bằng HTML thuần <details> cho Mobile (<768px, không dùng JS) -->
        <details class="mobile-menu-details">
          <summary class="mobile-menu-summary" aria-label="Mở menu điều hướng">
            <span class="menu-icon" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </span>
            <span class="menu-text">Menu</span>
          </summary>
          <nav class="mobile-dropdown-nav" aria-label="Menu di động">
            <a href="index.html#dich-vu" class="mobile-nav-link">Dịch vụ</a>
            <a href="index.html#quy-trinh" class="mobile-nav-link">Quy trình</a>
            <a href="lich-chup-cua-toi.html" class="mobile-nav-link">Lịch chụp của tôi</a>
          </nav>
        </details>
      </div>
    </div>
  </header>

  <main>
    <section class="section" aria-labelledby="booking-title">
      <div class="container">
        <h1 id="booking-title" class="section-title">Lịch chụp của tôi</h1>
        <p class="section-desc">
          Xem thông tin lịch chụp và tiến độ đặt cọc. Quay lại <a href="index.html">Trang chủ</a>.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p class="footer-copy">© GradStudio · TP. Hồ Chí Minh · Địa chỉ chỉ gửi khi đã cọc</p>
    </div>
  </footer>
</body>
</html>
